[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["src/laser_cross_detection"]

[tool.hatch.build.targets.wheel]
packages = ["src/laser_cross_detection"]

[project]
name = "laser-cross-detection"
version = "1.0.1"
description = "This projet contains the source code for the paper 'Robust laser cross detection for non-invasive volumetric camera calibration' published in Measurement Science and Technology (DOI 10.1088/1361-6501/adcb5b)"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Moritz Kluwe", email = "moritz-niklas.kluwe@imfd.tu-freiberg.de"},
    {name = "Robert Hardege", email = ""},
]
keywords = ["computer-vision", "image-processing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "lmfit>=1.3.3",
    "numpy>=2.2.6",
    "opencv-python>=4.11.0.86",
    "pandas>=2.2.3",
    "perlin-numpy",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.6.1",
    "scipy>=1.15.3",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.3",
    "ruff>=0.11.11",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "hypothesis>=6.150.2",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "I",   # isort
    "PYI", # pyright
    "TC",  # type-checking
    "TID252", # absolute imports only
]
exclude = ["*.ipynb"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.uv.sources]
perlin-numpy = { git = "https://github.com/pvigier/perlin-numpy" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_"]
addopts = [
    "-v",
    "--tb=short",
    "--color=yes",
]
filterwarnings = [
    # lmfit uses deprecated uncertainties API - suppress until lmfit updates
    "ignore:AffineScalarFunc.error_components:FutureWarning",
    "ignore:AffineScalarFunc.derivatives:FutureWarning",
]
